<div class="container py-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2>Editar Perfil</h2>
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input class="form-control" formControlName="nome" placeholder="Nome completo">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" formControlName="email" placeholder="email@dominio.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha (opcional)</label>
          <input class="form-control" type="password" formControlName="senha" placeholder="Nova senha">
        </div>
        <button class="btn btn-success" type="submit" [disabled]="saving || form.invalid">{{ saving ? 'Salvando...' : 'Salvar alterações' }}</button>
      </form>
    </div>
  </div>
</div>
